baseURL: "https://koative.github.io/hyperliquid-go/"
title: "hyperliquid-go"
enableRobotsTXT: true
enableGitInfo: true

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true # the API reference is HTML generated by doc2go

security:
  # The API reference is an HTML page generated by doc2go (gen-reference.sh).
  allowContent: ['! ^text/org$']

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: API Reference
      pageRef: /docs/reference
      weight: 2
    - name: pkg.go.dev ↗
      url: "https://pkg.go.dev/github.com/koative/hyperliquid-go"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/koative/hyperliquid-go"
      params:
        icon: github
  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 100
    - name: "Hyperliquid API docs ↗"
      url: "https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api"
      weight: 101
    - name: "Changelog ↗"
      url: "https://github.com/koative/hyperliquid-go/blob/main/CHANGELOG.md"
      weight: 102

params:
  description: A clean, fully featured Go SDK for the Hyperliquid API.
  externalLinkDecoration: true
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide
  page:
    width: wide
    contextMenu:
      enable: true
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  editURL:
    enable: true
    base: "https://github.com/koative/hyperliquid-go/edit/main/docs/content"
  highlight:
    copy:
      enable: true
      display: hover
