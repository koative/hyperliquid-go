name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./internal/msgpack
            target: FuzzFromJSON
          - pkg: .
            target: FuzzFormatPrice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime=10m "$PKG"
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
      # A failing input is written to <pkg>/testdata/fuzz/<target>/; commit it
      # as a regression seed.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: "**/testdata/fuzz/"
