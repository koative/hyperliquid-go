name: Bug report
description: Something in the SDK does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste private keys. For security issues, use [private vulnerability reporting](https://github.com/koative/hyperliquid-go/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the full error, and the raw API response if you have it.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest Go program that shows the problem.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: v0.1.0 (from go.mod)
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      placeholder: go1.27.1 (from `go version`)
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [Mainnet, Testnet, Not applicable]
    validations:
      required: true
